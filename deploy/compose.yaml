name: linchat
services:
  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: linchat:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - linchat-data:/data
    mem_limit: 384m
    cpus: 0.75
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
volumes:
  linchat-data:
