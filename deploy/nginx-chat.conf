# Add as a separate virtual host in the EXISTING Nginx configuration.
# Certificate paths must point to a certificate issued for chat.linblog.site.
server {
    listen 80;
    server_name chat.linblog.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/linchat-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chat.linblog.site;
    ssl_certificate /etc/letsencrypt/live/chat.linblog.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.linblog.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 26m;

    location /api/ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 150s;
    }
}
